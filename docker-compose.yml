name: suivi-equipements

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Senelec_Sql2026!}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Crée la base IndicateursTransportDistribution et ses tables si elles n'existent pas, puis s'arrête.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./db/init.sql:/init.sql:ro
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd"]
    command: ["-S", "sqlserver", "-U", "sa", "-P", "${MSSQL_SA_PASSWORD:-Senelec_Sql2026!}", "-C", "-b", "-i", "/init.sql"]
    restart: "no"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: "mssql+pyodbc://sa:${MSSQL_SA_PASSWORD:-Senelec_Sql2026!}@sqlserver:1433/IndicateursTransportDistribution?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
      JWT_SECRET: ${JWT_SECRET:-changez-moi}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@senelec.sn}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Senelec@2026}
      CORS_ORIGINS: http://localhost:4200
    depends_on:
      db-init:
        condition: service_completed_successfully
    volumes:
      # Fichiers Excel : déposez-y une nouvelle version puis lancez
      #   docker compose exec backend python -m app.import_excel
      - ./backend/data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "4200:80"
    restart: unless-stopped

volumes:
  mssql-data:
